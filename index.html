
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">

    <title>Secret Santa 2026</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="icon">🎅</div>

            <p class="subtitle">SECRET SANTA 2026</p>

            <h1>Un regalo,<br>una sorpresa.</h1>

            <p id="status">
                Preparando tu sorpresa...
            </p>

            <h2 id="participant"></h2>

            <button id="revealButton" hidden>
                Descubrir mi amigo secreto
            </button>

            <div id="result" class="result" hidden>
                <p>Tu amigo secreto es:</p>
                <h2 id="recipient"></h2>
                <span>¡Prepara una sorpresa especial! 🎁</span>
            </div>

        </div>

        <footer>
            SECRET SANTA · 2026
        </footer>

    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
